<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="p-2 vh-100 bg-dark">
    <div class="container mt-4">
        <h2 class="text-white">Фильтр товаров по дате</h2>

        <form action="/v1/shipment_item/list" method="GET" class="bg-light p-4 rounded">
            <div class="mb-3">
                <label for="date_start" class="form-label">Дата начала:</label>
                <input type="datetime-local" id="date_start" name="dateStart" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="date_end" class="form-label">Дата окончания:</label>
                <input type="datetime-local" id="date_end" name="dateEnd" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="status_req" class="form-label">Статус:</label>
                <select id="status_req" name="status" class="form-select" required>
                    <option value="RECEIVED">Поступившие заказы</option>
                    <option value="SHIPPED">Отгружены</option>
                    <option value="POSTPONED">Перенесенные</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Фильтровать</button>
        </form>

        <h3 class="mt-4 text-white">Результаты</h3>
        {% if table %}
            {{ table|safe }}
        {% endif %}
    </div>
</body>
</html>
